<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2a8a">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>MELAN</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MELAN">
<style>
:root{--bg:#f4f5f9;--c:#fff;--t:#17203a;--m:#6a7390;--p:#0a2a8a;--pt:#fff;--b:#d8dce8;--r:#b42318;--o:#b45309;--g:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0e1220;--c:#171d33;--t:#e8ebf5;--m:#98a1bf;--p:#f59e0b;--pt:#1b1200;--b:#2a3350;--r:#f87171;--o:#fbbf24;--g:#4ade80}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
input,select,textarea,button{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--p);color:var(--pt);position:sticky;top:0;z-index:5}
header img{height:30px;width:30px;border-radius:8px;vertical-align:middle;margin-right:8px}header a{text-decoration:underline}
nav{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b)}
nav button{flex:0 0 auto;border:1px solid var(--b);background:none;border-radius:20px;padding:6px 14px}nav button.on{background:var(--p);color:var(--pt);border-color:var(--p)}
main{max-width:760px;margin:0 auto;padding:10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:0 0 10px}
.card input,.card select,.card textarea{width:100%;margin:4px 0;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg)}
textarea{min-height:64px}
.pri,.card>button{background:var(--p);color:var(--pt);border:0;border-radius:8px;padding:10px 14px;margin-top:6px;width:100%}
.ghost{background:none!important;color:var(--t)!important;border:1px solid var(--b)!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.m{color:var(--m);font-size:14px}.tag{font-size:12px;border:1px solid var(--b);border-radius:12px;padding:2px 9px;flex:0 0 auto}
.red{color:var(--r)}.org{color:var(--o)}.grn{color:var(--g)}
.hero{text-align:center;padding:12px 0}.hero img{width:92px;height:92px;border-radius:22px}.hero p{margin:4px 0;color:var(--m)}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.sc button{min-width:44px;height:44px;border:1px solid var(--b);background:var(--bg);border-radius:10px}.sc button.on{background:var(--p);color:var(--pt);border-color:var(--p)}
.bar{display:grid;grid-template-columns:100px 1fr 42px;gap:8px;align-items:center;font-size:14px;margin:5px 0}.bar div{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}.bar em{font-style:normal;text-align:right}
.g{background:var(--g)}.o{background:var(--o)}.r{background:var(--r)}
.chips label{display:inline-block;border:1px solid var(--b);border-radius:16px;padding:4px 12px;margin:3px 4px 3px 0}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--b);padding:4px 6px;text-align:center}td:first-child,th:first-child{text-align:left}.wrap{overflow-x:auto}
.sheet{position:relative;background:#fff;color:#111;border:1px solid var(--b);padding:16px;border-radius:8px;margin-bottom:12px}
.paper{background:#fff;color:#111;font-family:"Times New Roman",Times,serif;border:1px solid var(--b);padding:18px;border-radius:6px;margin-bottom:12px}
.ph{text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px}.ph h1{margin:0;font-size:22px;letter-spacing:1px;text-transform:uppercase}.ph h2{margin:4px 0 0;font-size:18px;text-transform:uppercase}.ph h3{margin:2px 0;font-size:16px}
.ph .mt{display:flex;justify-content:space-between;flex-wrap:wrap;font-size:14px;gap:4px 14px;margin-top:6px}.sheet .ph{padding:0 92px 8px}
.ln{background:repeating-linear-gradient(transparent 0,transparent 27px,#8a94a6 28px);line-height:28px;min-height:56px;padding:0 6px;white-space:pre-wrap;border:1px solid #777;border-radius:3px;position:relative;margin:4px 0;font-family:"Segoe Print","Bradley Hand","Noteworthy","Comic Sans MS",cursive;color:#1a3a9c}
.paper textarea.an{width:100%;display:block;margin:4px 0;font-family:inherit;font-size:16px;color:#111;border:1px solid #777;border-radius:3px;background:repeating-linear-gradient(transparent 0,transparent 27px,#8a94a6 28px);line-height:28px;min-height:84px;padding:0 6px}
.mk{position:absolute;right:6px;bottom:0;color:#c00;font-weight:700;font-size:14px;font-family:Arial,sans-serif}.mkq{float:right;font-weight:700}
.score{position:absolute;top:12px;right:12px;border:2px solid #b42318;color:#b42318;padding:4px 12px;font-weight:700;border-radius:8px;font-size:20px}
.qq{margin:12px 0}.ansb{border:1px dashed #888;border-radius:6px;padding:7px 9px;margin:6px 0 2px;min-height:38px;white-space:pre-wrap;position:relative}
.ansb .pt{position:absolute;right:6px;bottom:2px;color:#b42318;font-weight:700;font-size:13px}.ansb .lb{color:#666;margin-right:6px}
.cmx{font-family:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive;background:#fff6c7;border:2px solid #e0a800;border-radius:12px;padding:3px 10px;margin:3px 0 6px 20px;color:#b3123f;font-size:15px;display:inline-block}
.gd{background:#eaf3ff;border-radius:6px;padding:5px 9px;font-size:14px;margin-top:4px}.tot{text-align:right;font-weight:700;color:#b42318}
@media print{header,nav,.np{display:none!important}body{background:#fff}.sheet{border:0;page-break-after:always}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=['Knowledge','Understanding','Application','Analysis','Evaluation','Creation'];
const DEF={overN:6,bands:[{min:80,name:'Distinction',c:'Excellent work. Keep it up.'},{min:60,name:'Credit',c:'Good work. Aim higher.'},{min:40,name:'Pass',c:'Fair. More practice needed.'},{min:0,name:'Needs help',c:'Please revise and ask for help.'}]};
let SET=DEF,SS={},U=JSON.parse(localStorage.getItem('u')||'null'),V='home',C={},G=[],QS=[],QI=0,PID=0;
const T=['create table if not exists m_schools(id integer primary key autoincrement,name text,tcode text unique,lcode text unique,settings text)',
'create table if not exists m_users(id integer primary key autoincrement,school_id int,name text,role text,gender text,cls text,pin text)',
'create table if not exists m_topics(id integer primary key autoincrement,school_id int,cls text,term text,subject text,name text)',
'create table if not exists m_subtopics(id integer primary key autoincrement,topic_id int,name text)',
'create table if not exists m_comps(id integer primary key autoincrement,topic_id int,name text)',
'create table if not exists m_papers(id integer primary key autoincrement,school_id int,teacher_id int,title text,cls text,term text,subject text,status text)',
'create table if not exists m_questions(id integer primary key autoincrement,paper_id int,n int,text text,marks real,spaces int,bloom text,topic_id int,sub_id int,comp_id int,guide text)',
'create table if not exists m_submissions(id integer primary key autoincrement,paper_id int,learner_id int)',
'create table if not exists m_answers(id integer primary key autoincrement,sub_id int,qid int,idx int,answer text,norm text,score real,comment text)',
'create index if not exists i1 on m_answers(qid,norm)','create index if not exists i2 on m_answers(sub_id)','create index if not exists i3 on m_questions(paper_id)',
'create index if not exists i4 on m_topics(school_id,subject)','create index if not exists i5 on m_users(school_id,role)','create index if not exists i6 on m_submissions(paper_id,learner_id)'];
const cfg=()=>JSON.parse(localStorage.getItem('cfg')||'null');
const AL=['alter table m_comps add column sub_id int','alter table m_papers add column deadline text','alter table m_papers add column pdate text','alter table m_users add column phone text','alter table m_users add column email text','create index if not exists i7 on m_subtopics(topic_id)','create index if not exists i8 on m_comps(topic_id)'];
async function migrate(){if(localStorage.getItem('mig')==='3')return;for(const q of AL)try{await db(q)}catch(e){}localStorage.setItem('mig','3')}
async function db(sql,a=[]){const c=cfg();const args=a.map(v=>v==null?{type:'null'}:typeof v==='number'?(Number.isInteger(v)?{type:'integer',value:String(v)}:{type:'float',value:v}):{type:'text',value:String(v)});
 const r=await fetch(c.url+'/v2/pipeline',{method:'POST',headers:{Authorization:'Bearer '+c.token,'Content-Type':'application/json'},body:JSON.stringify({requests:[{type:'execute',stmt:{sql,args}},{type:'close'}]})});
 const j=await r.json(),x=j.results&&j.results[0];if(!x||x.type==='error')throw new Error(x?x.error.message:'Database error');
 const q=x.response.result;return q.rows.map(w=>Object.fromEntries(q.cols.map((c,i)=>[c.name,w[i].value])))}
const ins=async(s,a)=>Number((await db(s,a))[0].id);
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const opts=(r,k='name')=>r.map(x=>`<option value="${x.id}">${esc(x[k])}</option>`).join('');
const val=id=>$('#'+id).value.trim(),safe=f=>async(...a)=>{try{await f(...a)}catch(e){alert(e.message)}};
const pc=t=>t&&t[1]?Math.round(t[0]/t[1]*100):0,band=p=>SET.bands.find(b=>p>=b.min)||SET.bands[SET.bands.length-1];
const norm=s=>s.toLowerCase().replace(/\s+/g,' ').replace(/[.,;!]+$/,'').trim();
const bars=b=>L.map(l=>{const v=b[l];if(!v||!v[1])return `<div class=bar><span>${l}</span><div></div><em>-</em></div>`;const p=pc(v);return `<div class=bar><span>${l}</span><div><i class="${p>=70?'g':p>=50?'o':'r'}" style="width:${p}%"></i></div><em>${p}%</em></div>`}).join('');
const dl=(id,a)=>`<datalist id=${id}>${[...new Set(a)].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;

/* ---------- setup, sign in, join ---------- */
function setup(){const c=cfg()||{};$('#app').innerHTML=`<main><div class=hero><img src=logo-96.png></div><div class=card><h3>Turso database</h3><input id=du placeholder="libsql://your-db.turso.io" value="${esc(c.url||'')}"><input id=dt placeholder="Auth token" value="${esc(c.token||'')}"><button onclick="saveCfg()">Save and prepare tables</button></div></main>`}
const saveCfg=safe(async()=>{localStorage.setItem('cfg',JSON.stringify({url:val('du').replace('libsql://','https://'),token:val('dt')}));for(const s of T)await db(s);localStorage.removeItem('mig');await migrate();auth()});
function auth(){$('#app').innerHTML=`<main><div class=hero><img src=logo-96.png><p>Learn. Practice. Grow.</p></div>
<div class=card><h3>Sign in</h3><input id=sc placeholder="School code (teacher or learner code)"><input id=nm placeholder="Your name"><input id=pn type=password placeholder="PIN"><button onclick="login()">Sign in</button></div>
<div class=card><h3>Join with a code</h3><p class=m>Your school gives you a teacher code or a learner code.</p><input id=js placeholder="Code"><input id=jn placeholder="Full name"><select id=jg><option value=F>Girl / Female</option><option value=M>Boy / Male</option></select><input id=jc placeholder="Class, for example P5 (learners only)"><input id=jph placeholder="Parent phone for SMS, for example +2567... (learners)"><input id=jem placeholder="Parent email (learners, optional)"><input id=jp type=password placeholder="Choose a PIN"><button onclick="join()">Join</button></div>
<div class=card><h3>Register a new school</h3><input id=ns placeholder="School name"><input id=tn placeholder="Your name (school administrator)"><input id=tp type=password placeholder="PIN"><button class=ghost onclick="regSchool()">Create school</button></div>
<p class=m><a href="#" onclick="setup();return false">Database settings</a></p></main>`}
const code=()=>Math.random().toString(36).slice(2,7).toUpperCase();
async function start(u){await migrate();U=u;localStorage.setItem('u',JSON.stringify(u));const s=(await db('select * from m_schools where id=?',[u.sid]))[0];SS=s;SET={...DEF,...JSON.parse(s.settings||'{}')};shell()}
const findSchool=async c=>(await db('select * from m_schools where tcode=? or lcode=?',[c.toUpperCase(),c.toUpperCase()]))[0];
const login=safe(async()=>{const s=await findSchool(val('sc'));if(!s)throw new Error('School code not found');
 const u=(await db('select * from m_users where school_id=? and lower(name)=lower(?) and pin=?',[s.id,val('nm'),await hash(val('pn'))]))[0];if(!u)throw new Error('Name or PIN is wrong');
 await start({id:+u.id,sid:+s.id,name:u.name,role:u.role,cls:u.cls,sn:s.name})});
const regSchool=safe(async()=>{if(!val('ns')||!val('tn')||!val('tp'))throw new Error('Fill every field');const t='T'+code(),l='L'+code();
 const sid=await ins('insert into m_schools(name,tcode,lcode) values(?,?,?) returning id',[val('ns'),t,l]);
 const id=await ins("insert into m_users(school_id,name,role,pin) values(?,?,'admin',?) returning id",[sid,val('tn'),await hash(val('tp'))]);
 alert('Teacher code: '+t+'\nLearner code: '+l+'\nYou can see both again in Settings.');await start({id,sid,name:val('tn'),role:'admin',sn:val('ns')})});
const join=safe(async()=>{const s=await findSchool(val('js'));if(!s)throw new Error('Code not found');const teacher=val('js').toUpperCase()===s.tcode;
 if(!val('jn')||!val('jp'))throw new Error('Fill name and PIN');if(!teacher&&!val('jc'))throw new Error('Enter your class');
 const cls=teacher?null:val('jc').toUpperCase();const id=await ins('insert into m_users(school_id,name,role,gender,cls,pin,phone,email) values(?,?,?,?,?,?,?,?) returning id',[s.id,val('jn'),teacher?'teacher':'learner',val('jg'),cls,await hash(val('jp')),val('jph'),val('jem')]);
 await start({id,sid:+s.id,name:val('jn'),role:teacher?'teacher':'learner',cls,sn:s.name})});
const out=()=>{localStorage.removeItem('u');U=null;auth()};

/* ---------- shell ---------- */
const TT=[['home','Home'],['cur','Curriculum'],['papers','Papers'],['lrn','Learners'],['rep','Reports'],['set','Settings']],LT=[['lp','My papers'],['perf','My performance']];
function shell(){const t=U.role!=='learner';$('#app').innerHTML=`<header><b><img src=logo-96.png>${esc(U.sn)}</b> <small style="opacity:.7">v3</small><span>${esc(U.name)} · <a onclick="out()">Log out</a></span></header><nav>${(t?TT:LT).map(x=>`<button id=n-${x[0]} onclick="nav('${x[0]}')">${x[1]}</button>`).join('')}</nav><main id=v></main>`;nav(t?'home':'lp')}
const views={home:()=>vHome(),cur:()=>vCur(),papers:()=>vPapers(),lrn:()=>vLrn(),rep:()=>vRep(),set:()=>vSet(),lp:()=>vLp(),perf:()=>vPerf()};
function nav(v){V=v;$$('nav button').forEach(b=>b.classList.toggle('on',b.id==='n-'+v));safe(views[v])()}

/* ---------- coverage (over-set reminders) ---------- */
async function cov(){const a=[U.id,U.sid];
 const [t,s]=await Promise.all([db('select t.*,(select count(*) from m_questions q join m_papers p on p.id=q.paper_id where q.topic_id=t.id and p.teacher_id=?) n from m_topics t where t.school_id=? order by cls,term,subject,name',a),
 db('select s.*,(select count(*) from m_questions q join m_papers p on p.id=q.paper_id where q.sub_id=s.id and p.teacher_id=?) n from m_subtopics s where topic_id in(select id from m_topics where school_id=?)',a)]);return{t,s}}
const flag=n=>n>=SET.overN?'red':n==0?'org':'grn';
function tree(d,only){const by={};d.t.forEach(x=>(by[x.cls]??=[]).push(x));let h='';
 for(const c in by){const ts=by[c].filter(x=>!only||x.n>=SET.overN||(x.n==0)||d.s.some(s=>s.topic_id==x.id&&s.n>=SET.overN));if(!ts.length)continue;const tot=by[c].reduce((a,x)=>a+ +x.n,0);
  h+=`<div class=card><b>${esc(c)}</b> <span class=m>${tot} questions picked from this class</span>`+ts.map(x=>`<div style="margin:8px 0"><span class="${flag(+x.n)}"><b>${esc(x.name)}</b></span> <span class=m>${esc(x.subject)}, Term ${esc(x.term)} · set ${x.n}×${x.n>=SET.overN?' · OVER-SET':x.n==0?' · not set yet':''}</span>`+
  d.s.filter(s=>s.topic_id==x.id&&(!only||s.n>=SET.overN||s.n==0)).map(s=>`<div class="m ${flag(+s.n)}" style="margin-left:14px">- ${esc(s.name)} (${s.n}×)${s.n>=SET.overN?' over-set':s.n==0?' ignored':''}</div>`).join('')+'</div>').join('')+'</div>'}
 return h||'<p class=m>Nothing to report yet.</p>'}
const vHome=async()=>{const d=await cov(),ov=d.t.filter(x=>x.n>=SET.overN).length,ig=d.t.filter(x=>x.n==0).length;
 $('#v').innerHTML=`<div class=card><b>Reminders</b><p class=m>You are over-setting <b class=red>${ov}</b> topic(s) (${SET.overN} or more questions) and ignoring <b class=org>${ig}</b> topic(s) with no questions yet. Subtopics and the classes you pick from are listed below.</p><button onclick="nav('papers')">Set a paper</button></div>`+tree(d,true)};

/* ---------- curriculum: find a topic, then add more later ---------- */
async function vCur(){const t=await db('select t.*,(select count(*) from m_subtopics where topic_id=t.id) sc,(select count(*) from m_comps where topic_id=t.id) cc,(select count(*) from m_questions q join m_papers p on p.id=q.paper_id where q.topic_id=t.id and p.teacher_id=?) n from m_topics t where school_id=? order by cls,term,subject,name',[U.id,U.sid]);window.TP=t;
 $('#v').innerHTML=`<div class=card><b>Find a topic</b><input id=cs placeholder="Search by topic, class or subject" oninput="curList()"></div>
 <details class=card><summary><b>Add new topics (outline)</b></summary><p class=m>Choose class, term and subject. A plain line is a topic, a line starting with - is a subtopic, and a line starting with * is a competence under the subtopic above it. You can add more later.</p>
 <input id=o1 list=dc placeholder="Class, for example P5"><div class=row><select id=o2><option>1</option><option>2</option><option>3</option></select><input id=o3 list=ds placeholder="Subject"></div>${dl('dc',t.map(x=>x.cls))}${dl('ds',t.map(x=>x.subject))}
 <textarea id=o4 style="min-height:130px" placeholder="Types of computers&#10;- Laptop&#10;* Learner can compare computers&#10;- Desktop"></textarea><button onclick="saveOutline()">Save outline</button></details><div id=cl></div>`;curList()}
const curList=()=>{const k=($('#cs').value||'').toLowerCase();$('#cl').innerHTML=TP.filter(x=>(x.name+' '+x.cls+' '+x.subject).toLowerCase().includes(k)).map(x=>`<div class="card" onclick="topicPage(${x.id})"><div class=row><b class="${flag(+x.n)}">${esc(x.name)}</b><span class=m>${esc(x.cls)} · T${esc(x.term)} · ${esc(x.subject)}</span></div><div class=m>${x.sc} subtopics · ${x.cc} competences · set ${x.n}×${x.n>=SET.overN?' (over-set)':''}</div></div>`).join('')||'<p class=m>No topic found. Add it above.</p>'};
const lines=id=>$('#'+id).value.split('\n').map(x=>x.trim().replace(/^[-*]\s*/,'')).filter(Boolean);
const topicPage=safe(async id=>{const t=(window.TP||[]).find(x=>x.id==id)||(await db('select * from m_topics where id=?',[id]))[0];
 const [s,c]=await Promise.all([db('select s.*,(select count(*) from m_questions q join m_papers p on p.id=q.paper_id where q.sub_id=s.id and p.teacher_id=?) n from m_subtopics s where topic_id=? order by id',[U.id,id]),db('select * from m_comps where topic_id=? order by id',[id])]);
 $('#v').innerHTML=`<button class="pri ghost" onclick="nav('cur')">Back to topics</button><br><br><div class=card><b>${esc(t.name)}</b><div class=m>${esc(t.cls)} · Term ${esc(t.term)} · ${esc(t.subject)}</div><p class=m>Add more subtopics, one per line:</p><textarea id=ns1></textarea><button onclick="addSubs(${id})">Add subtopics</button></div>`+
 s.map(x=>`<div class=card><b>${esc(x.name)}</b> <span class="m ${flag(+x.n)}">set ${x.n}×</span>${c.filter(y=>y.sub_id==x.id).map(y=>`<div class=m>- ${esc(y.name)}</div>`).join('')}<textarea id=nc${x.id} placeholder="Add competences, one per line"></textarea><button class=ghost onclick="addComps(${x.id},${id})">Add competences</button></div>`).join('')+
 (c.some(y=>!y.sub_id)?`<div class=card><b>Other competences</b>${c.filter(y=>!y.sub_id).map(y=>`<div class=m>- ${esc(y.name)}</div>`).join('')}</div>`:'')});
const addSubs=safe(async tid=>{for(const n of lines('ns1'))if(!(await db('select id from m_subtopics where topic_id=? and lower(name)=lower(?)',[tid,n]))[0])await db('insert into m_subtopics(topic_id,name) values(?,?)',[tid,n]);topicPage(tid)});
const addComps=safe(async(sid,tid)=>{for(const n of lines('nc'+sid))if(!(await db('select id from m_comps where sub_id=? and lower(name)=lower(?)',[sid,n]))[0])await db('insert into m_comps(topic_id,sub_id,name) values(?,?,?)',[tid,sid,n]);topicPage(tid)});
const saveOutline=safe(async()=>{const cls=val('o1').toUpperCase(),term=val('o2'),sub=val('o3'),txt=$('#o4').value;if(!cls||!sub||!txt.trim())throw new Error('Enter class, subject and the outline');let t=null,sb=null;
 for(const raw of txt.split('\n')){const l=raw.trim();if(!l)continue;const k=l[0],name=l.replace(/^[-*]\s*/,'');
  if(k==='-'){if(!t)continue;const e=(await db('select id from m_subtopics where topic_id=? and lower(name)=lower(?)',[t,name]))[0];sb=e?+e.id:await ins('insert into m_subtopics(topic_id,name) values(?,?) returning id',[t,name])}

 const r=await db(sql,ar),ad=(o,k,x)=>{const t=o[k]??=[0,0];t[0]+=+x.score;t[1]+=+x.marks},lr={},nm={},bl={},gn={},gb={},qs={},qi={};
 r.forEach(x=>{const gg=x.gender||'?';ad(lr,x.uid,x);nm[x.uid]=x.name;ad(bl,x.bloom,x);ad(gn,gg,x);ad(gb[gg]??={},x.bloom,x);ad(qs,x.qid,x);qi[x.qid]=x});
 const ls=Object.entries(lr).map(([k,l])=>({n:nm[k],p:pc(l)})).sort((a,b)=>a.p-b.p),bd={};ls.forEach(l=>{const b=band(l.p);bd[b.name]=(bd[b.name]||0)+1});
 $('#rb').innerHTML=!r.length?'<p class=m>No marked work yet.</p>':`<div class=card><b>Notification link (optional)</b><p class=m>If you have an SMS or email service, paste its web address here. The app sends it the message, phone numbers and emails.</p><input id=s3 value="${esc(SET.hook||'')}" ${a?'':'disabled'}><b>Performance bands</b>${SET.bands.map(b=>`<div class=row><span>${esc(b.name)} <span class=m>${b.min}%+</span></span><b>${bd[b.name]||0} learner(s)</b></div><div class=m>${esc(b.c)}</div>`).join('')}</div>
 <div class=card><b>Cognitive level (Bloom)</b>${bars(bl)}</div>
 <div class=card><b>By gender</b>${Object.keys(gn).map(k=>`<div style="margin:8px 0"><b>${k==='M'?'Boys':k==='F'?'Girls':'Not stated'}: ${pc(gn[k])}%</b>${bars(gb[k])}</div>`).join('')}</div>
 <div class=card><b>Questions, hardest first</b>${Object.entries(qs).sort((a,b)=>pc(a[1])-pc(b[1])).slice(0,12).map(([id,t])=>`<div class=bar style="grid-template-columns:1fr 42px 42px"><span>Q${qi[id].n} <span class=m>${qi[id].bloom}</span></span><span></span><em>${pc(t)}%</em></div>`).join('')}</div>
 <div class=card><b>Learners, lowest first</b>${ls.slice(0,40).map(l=>`<div class=row><span>${esc(l.n)}</span><span>${l.p}% · ${esc(band(l.p).name)}</span></div>`).join('')}</div>`});

/* ---------- settings ---------- */
const vSet=()=>{const a=U.role==='admin',bt=SET.bands.map(b=>[b.min,b.name,b.c].join('|')).join('\n');
 $('#v').innerHTML=`<div class=card><b>${esc(SS.name)}</b>${a?`<p class=m>Teacher code: <b>${esc(SS.tcode)}</b><br>Learner code: <b>${esc(SS.lcode)}</b><br>Give each group its own code. Anyone who joins with it is registered.</p>`:''}</div>
 <div class=card><b>Over-set reminder</b><p class=m>Warn me when a topic or subtopic has this many questions or more.</p><input id=s1 type=number min=2 value=${SET.overN} ${a?'':'disabled'}>
 <b>Performance bands</b><p class=m>One per line: minimum percent | name | comment</p><textarea id=s2 style="min-height:110px" ${a?'':'disabled'}>${esc(bt)}</textarea>${a?'<button onclick="saveSet()">Save settings</button>':'<p class=m>Only the administrator can change settings.</p>'}</div>
 <button class="pri ghost" onclick="setup()">Database connection</button>`};
const saveSet=safe(async()=>{const bands=$('#s2').value.split('\n').map(l=>l.split('|')).filter(x=>x.length>=2).map(x=>({min:+x[0]||0,name:x[1].trim(),c:(x[2]||'').trim()})).sort((a,b)=>b.min-a.min);if(!bands.length)throw new Error('Add at least one band');
 SET={overN:+val('s1')||6,bands,hook:val('s3')};await db('update m_schools set settings=? where id=?',[JSON.stringify(SET),U.sid]);alert('Saved')});

/* ---------- learner ---------- */
const vLp=async()=>{const r=await db('select p.id,p.title,p.subject,p.status,p.deadline,s.id sid from m_papers p left join m_submissions s on s.paper_id=p.id and s.learner_id=? where p.school_id=? and lower(p.cls)=lower(?) order by p.id desc',[U.id,U.sid,U.cls||'']);
 $('#v').innerHTML=r.map(p=>{const late=p.deadline&&new Date(p.deadline)<new Date(),st=!p.sid?(late?'closed':'to do'):p.status==='released'?'view marked script':'awaiting marks';return `<div class="card row" onclick="lOpen(${p.id},${p.sid||0},'${p.status}','${esc(p.deadline||'')}')"><span><b>${esc(p.title)}</b><br><span class=m>${esc(p.subject)}${p.deadline?' · due '+fd(p.deadline):''}</span></span><span class=tag>${st}</span></div>`}).join('')||'<p class=m>No papers for your class yet.</p>'};
const lOpen=safe(async(pid,sid,st,dl)=>{if(sid&&st==='released')return showScript(sid,"nav('lp')");if(sid)return alert('Your teacher has not released the marks yet');if(dl&&new Date(dl)<new Date())return alert('The deadline for this paper has passed');
 const [p,q]=await getP(pid);PID=pid;DL=dl;$('#v').innerHTML=`<div class=paper>${pHead(p,U.name)}${INS}${qHtml(q,true)}</div><button class=pri onclick="submitP()">Submit paper</button>`});
const submitP=safe(async()=>{if(DL&&new Date(DL)<new Date())throw new Error('The deadline has passed');if(!confirm('Submit your answers? You cannot change them after.'))return;const s=await ins('insert into m_submissions(paper_id,learner_id) values(?,?) returning id',[PID,U.id]);
 for(const c of $$('.qa'))for(const [i,t] of [...c.querySelectorAll('.an')].entries()){const n=norm(t.value);await db('insert into m_answers(sub_id,qid,idx,answer,norm,score) values(?,?,?,?,?,?)',[s,c.dataset.q,i,t.value.trim(),n,n?null:0])}
 nav('lp')});
const vPerf=async()=>{const r=await db("select a.score,q.id qid,q.n,q.text,q.bloom,q.marks,q.guide,p.title from m_answers a join m_submissions s on s.id=a.sub_id join m_questions q on q.id=a.qid join m_papers p on p.id=q.paper_id where s.learner_id=? and p.status='released' and a.score is not null",[U.id]);
 if(!r.length)return $('#v').innerHTML='<p class=m>Your analysis appears after your teacher releases a marked paper.</p>';
 const ad=(o,k,x)=>{const t=o[k]??=[0,0];t[0]+=+x.score;t[1]+=+x.marks},tot=[0,0],bl={},pp={},qq={};r.forEach(x=>{tot[0]+=+x.score;tot[1]+=+x.marks;ad(bl,x.bloom,x);ad(pp,x.title,x);ad(qq,x.qid,x)});
 const p=pc(tot),b=band(p),qi={};r.forEach(x=>qi[x.qid]=x);const weak=Object.entries(qq).filter(([,t])=>pc(t)<50).sort((a,b)=>pc(a[1])-pc(b[1])).slice(0,8);
 const lv=L.filter(l=>bl[l]).sort((a,b)=>pc(bl[b])-pc(bl[a]));
 $('#v').innerHTML=`<div class=card><b>Overall: ${p}% · ${esc(b.name)}</b><p>${esc(b.c)}</p></div><div class=card><b>By cognitive level</b>${bars(bl)}${lv.length>1?`<p class=m>Strongest: ${lv[0]}. Needs work: ${lv[lv.length-1]}.</p>`:''}</div>
 <div class=card><b>By paper</b>${Object.entries(pp).map(([k,t])=>`<div class=row><span>${esc(k)}</span><b>${pc(t)}%</b></div>`).join('')}</div>
 <div class=card><b>Questions you missed most</b>${weak.map(([id,t])=>`<div style="margin:8px 0"><span class=red><b>Q${qi[id].n}</b> ${pc(t)}%</span> <span class=m>${qi[id].bloom}</span><br>${esc(qi[id].text)}${qi[id].guide?`<div class=gd style="background:var(--bg)">Expected answer: ${esc(qi[id].guide)}</div>`:''}</div>`).join('')||'<span class=m>None below 50%. Well done.</span>'}</div>`};

!cfg()?setup():U?start(U).catch(()=>auth()):auth();
</script></body></html>
